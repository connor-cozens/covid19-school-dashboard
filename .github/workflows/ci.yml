name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Report-only until the existing react-hooks lint errors are fixed
      - name: Lint (report only)
        run: npm run lint
        continue-on-error: true

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Packages that ship to the server/browser; script-only tools are devDependencies
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  docker-e2e:
    name: Docker build & browser tests
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The real closures data is not in the repo; build against synthetic data
      - name: Use sample closures data
        run: npm run ci:sample-data

      # Same Dockerfile as production; its build runs the data regression checks
      - uses: docker/setup-buildx-action@v4
      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: covid-dashboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: |
          docker run -d --name app -p 3000:3000 covid-dashboard:ci
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/ && exit 0
            sleep 1
          done
          echo "Container did not become ready"; docker logs app; exit 1

      - name: Smoke test page and data files
        run: |
          for path in / /data/school_closures.json /data/covid19_schools_active_with_demographics_combined.json \
                      /data/school_boards.json /data/municipalities.json /data/school_demographics_lookup.json; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$path")
            echo "$code $path"
            [ "$code" = "200" ] || exit 1
          done

      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
        env:
          BASE_URL: http://localhost:3000

      - name: Container logs
        if: failure()
        run: docker logs app
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
